<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BuildHound</title>
    <style>
        :root { color-scheme: light dark; }
        body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 76rem; padding: 0 1rem; color: #1a1a2e; }
        @media (prefers-color-scheme: dark) { body { color: #e8e8f0; background: #14141c; } }
        header { display: flex; align-items: baseline; gap: 1rem; border-bottom: 2px solid #8884; padding-bottom: 1rem; margin-bottom: 1rem; }
        h1 { margin: 0; font-size: 1.3rem; }
        nav a { margin-right: .75rem; }
        .muted { color: #888; font-size: .85rem; }
        .filters { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1rem 0; align-items: center; }
        input, select, button { font: inherit; padding: .3rem .5rem; border-radius: .3rem; border: 1px solid #8886; background: inherit; color: inherit; }
        table { border-collapse: collapse; width: 100%; font-size: .875rem; }
        th, td { text-align: left; padding: .35rem .6rem; border-bottom: 1px solid #8883; }
        td.num { text-align: right; font-variant-numeric: tabular-nums; }
        tr.row { cursor: pointer; }
        tr.row:hover { background: #8882; }
        .badge { border-radius: .25rem; padding: .1rem .4rem; font-size: .75rem; font-weight: 600; }
        .EXECUTED { background: #fde68a; color: #713f12; }
        .FROM_CACHE { background: #bbf7d0; color: #14532d; }
        .UP_TO_DATE { background: #bfdbfe; color: #1e3a8a; }
        .SKIPPED, .NO_SOURCE { background: #e5e7eb; color: #374151; }
        .SUCCESS { color: #15803d; font-weight: 600; }
        .FAILED { background: #fecaca; color: #7f1d1d; }
        .INTERRUPTED { background: #fed7aa; color: #7c2d12; }
        .flaky-retry { background: #fde68a; color: #713f12; }
        .flaky-cross { background: #fecaca; color: #7f1d1d; }
        .flaky-both { background: #ddd6fe; color: #4c1d95; }
        .warn-always-run { background: #fecaca; color: #7f1d1d; }
        .warn-non-incremental-ap { background: #fde68a; color: #713f12; }
        .warn-dynamic-debug { background: #bfdbfe; color: #1e3a8a; }
        .chips { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1rem 0; padding: 0; list-style: none; }
        .chips li { border: 1px solid #8884; border-radius: 1rem; padding: .25rem .75rem; font-size: .85rem; }
        svg { width: 100%; height: auto; }
        #token-bar { background: #8881; border: 1px solid #8884; border-radius: .4rem; padding: .75rem; margin-bottom: 1rem; }
        .error { color: #b91c1c; }
        .summary-sentence { font-weight: 600; font-size: 1.05rem; margin: .75rem 0; }
        .empty { border: 1px dashed #8886; border-radius: .5rem; padding: 1.5rem; margin: 1rem 0; }
        .empty h3 { margin: 0 0 .5rem; }
        .empty p { margin: .25rem 0; }
        .snippet { background: #8881; border: 1px solid #8884; border-radius: .4rem; padding: .75rem; overflow-x: auto; font-family: ui-monospace, monospace; font-size: .8rem; white-space: pre; }
        table.ledger td:first-child, table.ledger th:first-child { width: 60%; }
        table.ledger tr.child td:first-child { padding-left: 1.75rem; color: #888; }
        .notice-warn { background: #fef3c7; border: 1px solid #fcd34d; color: #713f12; border-radius: .4rem; padding: .6rem .8rem; margin: .5rem 0; font-size: .9rem; }
        .span-tree { list-style: none; padding-left: 1rem; margin: .25rem 0; }
        .span-tree .span-tree { padding-left: 1.25rem; border-left: 1px solid #8884; }
        .span-tree li { margin: .15rem 0; }
        .span-kind { font-size: .7rem; text-transform: uppercase; letter-spacing: .03em; margin-right: .35rem; }
        .kpi-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: .75rem; margin: 1rem 0; }
        .kpi { border: 1px solid #8884; border-radius: .5rem; padding: .75rem; display: flex; flex-direction: column; gap: .15rem; }
        .kpi-label { font-size: .8rem; color: #888; }
        .kpi-value { font-size: 1.4rem; font-weight: 700; font-variant-numeric: tabular-nums; }
        .delta { font-size: .85rem; font-weight: 600; }
        .delta-good { color: #15803d; }
        .delta-bad { color: #b91c1c; }
        .delta-flat { color: #888; }
        tr.behind td { background: #fef3c744; }
        .failure-summary { font-weight: 600; color: #b91c1c; margin: .5rem 0; word-break: break-word; }
        .failure-trace { background: #8881; border: 1px solid #8883; border-radius: .25rem; padding: .75rem; overflow: auto; max-height: 32rem; font-size: .8rem; white-space: pre-wrap; word-break: break-word; }
        ul.warnings { margin: .25rem 0 .75rem; }
        ul.warnings li { font-size: .85rem; word-break: break-word; }

        /* ---------------------------------------------------------------------------
           Charts (plan 105). DESIGN-V2 tokens, scoped to chart surfaces — the rest of
           this stylesheet is pre-V2 and is retokenized by its own plan. Everything here
           lives inline because the CSP's style-src carries hashes and no 'self', so an
           external stylesheet (including uPlot's own) cannot be linked; styleHashCsp
           rehashes this block from the served bytes on boot.
           --------------------------------------------------------------------------- */
        :root {
            --bh-surface: #FFFDF9; --bh-grid: #E7DED3;
            --bh-border: #D8CDBF; --bh-control-border: #96897B;
            --bh-text-secondary: #594F45; --bh-text-muted: #6F655A;
            --bh-focus: #2A6FD1;
            --bh-success-solid: #1F8055; --bh-failure-solid: #C22E33;
            --bh-info-solid: #2A6FD1; --bh-neutral-solid: #6F655A;
            --bh-select-tint: #21201C1f;
            --bh-font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --bh-font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bh-surface: #1D1A16; --bh-grid: #2B261F;
                --bh-border: #40382F; --bh-control-border: #7D705F;
                --bh-text-secondary: #C9BFAF; --bh-text-muted: #A89D8E;
                --bh-focus: #6FA8FF;
                --bh-success-solid: #4ABD8C; --bh-failure-solid: #E5646A;
                --bh-info-solid: #6FA8FF; --bh-neutral-solid: #A89D8E;
                --bh-select-tint: #F2EBDF26;
            }
        }

        /* uPlot 1.6.32 stylesheet (dist/uPlot.min.css), reformatted and retokenized:
           the upstream font stack, cursor color and selection tint are replaced by
           DESIGN-V2 tokens so both themes track. No url()/@import/@font-face — the CSP
           allows neither, and the page loads no webfont. */
        .uplot, .uplot *, .uplot *::before, .uplot *::after { box-sizing: border-box; }
        .uplot { font-family: var(--bh-font-ui); line-height: 1.5; width: min-content; }
        .u-title { text-align: center; font-size: 18px; font-weight: bold; }
        .u-wrap { position: relative; user-select: none; }
        .u-over, .u-under { position: absolute; }
        .u-under { overflow: hidden; }
        .uplot canvas { display: block; position: relative; width: 100%; height: 100%; }
        .u-axis { position: absolute; }
        .u-legend { font-size: 13px; margin: auto; text-align: center; color: var(--bh-text-secondary); }
        .u-inline { display: block; }
        .u-inline * { display: inline-block; }
        .u-inline tr { margin-right: 16px; }
        .u-legend th { font-weight: 600; }
        .u-legend th > * { vertical-align: middle; display: inline-block; }
        .u-legend .u-marker { width: 1em; height: 1em; margin-right: 4px; background-clip: padding-box !important; }
        .u-inline.u-live th::after { content: ":"; vertical-align: middle; }
        .u-inline:not(.u-live) .u-value { display: none; }
        .u-series > * { padding: 4px; }
        .u-series th { cursor: pointer; }
        .u-legend .u-off > * { opacity: .3; }
        .u-legend .u-value { font-family: var(--bh-font-mono); font-variant-numeric: tabular-nums; }
        .u-select { background: var(--bh-select-tint); position: absolute; pointer-events: none; }
        .u-cursor-x, .u-cursor-y { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform; }
        .u-hz .u-cursor-x, .u-vt .u-cursor-y { height: 100%; border-right: 1px dashed var(--bh-control-border); }
        .u-hz .u-cursor-y, .u-vt .u-cursor-x { width: 100%; border-bottom: 1px dashed var(--bh-control-border); }
        .u-cursor-pt { position: absolute; top: 0; left: 0; border-radius: 50%; border: 0 solid; pointer-events: none; will-change: transform; background-clip: padding-box !important; }
        .u-axis.u-off, .u-select.u-off, .u-cursor-x.u-off, .u-cursor-y.u-off, .u-cursor-pt.u-off { display: none; }

        /* One boundary per chart group (DESIGN-V2 §5) — a figure, never a card in a card. */
        .chart-card { border: 1px solid var(--bh-border); border-radius: 8px; padding: 16px; margin: 24px 0; background: var(--bh-surface); }
        .chart-card > figcaption { color: var(--bh-text-secondary); font-size: 13px; margin-bottom: 12px; }
        .chart-card > figcaption > b { color: inherit; font-weight: 650; }
        /* The 32px measurement grid belongs to the chart canvas only (§5), never behind
           dense surfaces. Decorative: the plot itself is aria-hidden. */
        .chart-plot {
            background-image:
                linear-gradient(90deg, transparent 31px, var(--bh-grid) 32px),
                linear-gradient(180deg, transparent 31px, var(--bh-grid) 32px);
            background-size: 32px 32px;
            overflow-x: auto;
        }
        .chart-empty { color: var(--bh-text-muted); font-size: .85rem; margin: .5rem 0; }
        .chart-values { margin-top: 12px; }
        /* Height via padding, not display:flex — flex on a <summary> drops its disclosure
           marker, and the triangle is the affordance that says the values can be opened. */
        .chart-values > summary { cursor: pointer; font-size: .85rem; color: var(--bh-text-secondary); padding: .6rem 0; min-height: 36px; box-sizing: border-box; }
        .chart-values table { margin-top: .5rem; }
        .chart-values td.num { font-family: var(--bh-font-mono); }
        /* The page-wide `svg { width: 100% }` rule above is meant for full-width charts and
           would blow a 16x10 legend swatch up to the button's width — pin it back. */
        /* Minimum command-target height (DESIGN-V2 §5): 36px desktop, 44px on mobile. */
        .chart-legend button { display: inline-flex; align-items: center; gap: .4em; min-height: 36px; }
        .chart-legend .chart-swatch { width: 16px; height: 10px; flex: none; }
        .chart-legend button[aria-pressed="false"] { opacity: .55; text-decoration: line-through; }
        .sr-only { position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; overflow: hidden !important; clip: rect(0, 0, 0, 0) !important; white-space: nowrap !important; border: 0 !important; }
        :where(a, button, select, input, summary, [tabindex]):focus-visible { outline: 2px solid var(--bh-focus); outline-offset: 2px; }
        @media (max-width: 580px) {
            .chart-legend button, .chart-values > summary { min-height: 44px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
        }
    </style>
</head>
<body>
<header>
    <h1>BuildHound</h1>
    <nav>
        <a href="#/bottlenecks">Bottlenecks</a>
        <a href="#/builds">Builds</a>
        <a href="#/trends">Trends</a>
        <a href="#/tasks">Tasks</a>
        <a href="#/tests">Tests</a>
        <a href="#/flaky">Flaky</a>
        <a href="#/delivery">Delivery</a>
        <a href="#/benchmark">Benchmark</a>
        <a href="#/compare">Compare</a>
        <a href="#/admin">Admin</a>
    </nav>
    <select id="project-select" hidden aria-label="Project"></select>
    <button id="token-forget" hidden>Forget token</button>
    <span class="muted">buildhound.dev</span>
</header>
<div id="token-bar" hidden>
    <label>Read token: <input id="token-input" type="password" size="40" autocomplete="off"></label>
    <button id="token-save">Use</button>
    <span class="muted">A read-scope token is remembered in this browser; an all-scope token is kept for this tab only.</span>
    <span id="token-status" class="error"></span>
</div>
<p id="token-note" class="muted" hidden></p>
<main id="app"><p class="muted">Loading…</p></main>
<script src="/timeline.js"></script>
<script src="/uplot.js"></script>
<script src="/dashboard.js"></script>
</body>
</html>
