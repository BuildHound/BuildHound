# Scheduled gradle-profiler benchmark pipeline for BuildHound (spec §7, plan 030) — GitHub Actions.
#
# Runs the pilot's real build under gradle-profiler once per (isolation, scenario) pair, exporting a
# matching BUILDHOUND_BENCHMARK_* for each invocation. The plugin uploads each measured build as
# mode=benchmark; the server excludes those from fleet trends and surfaces them at #/benchmark.
#
# The token is mapped from a repository secret and only ever leaves via the plugin's Authorization
# header — never echoed. No OpenAI/BigQuery side channel (an explicit negative lesson from
# Telltale/Bagan): the series lives in BuildHound.
#
# Copy this into .github/workflows/ of the pilot's repository and adjust the marked spots. It is a
# matrix — one job per (isolation, scenario) — rather than a serial loop, for two reasons that are
# correctness, not speed:
#   1. The plugin reads BUILDHOUND_BENCHMARK_* inside the measured Gradle daemon, and gradle-profiler
#      reuses daemons. A job per scenario means a fresh daemon per label, so a scenario can never
#      inherit the previous one's label and silently mislabel a series.
#   2. Cache isolation is applied to a fresh checkout per job, so no pristine-copy/restore dance.
# BuildHound's own instance of this pipeline is .github/workflows/nightly-benchmark.yml (plan 105).

name: nightly-benchmark
on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC nightly
  workflow_dispatch: {}    # allow manual runs

permissions:
  contents: read

concurrency:
  group: nightly-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    name: "${{ matrix.scenario }} · ${{ matrix.isolation }}"
    # Scheduled workflows are inherited by forks — keep the matrix from running there.
    if: github.repository == 'your-org/your-pilot'   # <-- adjust
    runs-on: ubuntu-latest
    # A benchmark series is diagnostic, not a gate: a bad runner must not redden the nightly.
    continue-on-error: true
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # v1 wires two isolation modes (see isolation-modes.md); add more as recipe opt-ins.
        isolation: [full_cache, no_build_cache]
        # The scenario names are the plugin's allowlist (BenchmarkActivation.SCENARIOS).
        scenario: [clean, no_op, incremental_non_abi, cc_hit]
    # Job-level env on purpose: the runner echoes STEP-level env mappings verbatim, so a `vars.*`
    # value mapped at step level is printed in the log (secrets stay masked). Job level is not.
    env:
      # Point these at the PRODUCTION ingest server so the nightly series lands on the dashboard the
      # team actually reads. The URL expression collapses to '' when the token secret is absent, and
      # the plugin's UploadGate skips on an empty URL ("no server configured") — so this file is safe
      # to merge before the credentials exist, and never POSTs unauthenticated.
      BUILDHOUND_SERVER_URL: ${{ secrets.BUILDHOUND_TOKEN != '' && vars.BUILDHOUND_SERVER_URL || '' }}
      BUILDHOUND_TOKEN: ${{ secrets.BUILDHOUND_TOKEN }}   # ingest-scoped; never echoed
      BUILDHOUND_BENCHMARK_ISOLATION: ${{ matrix.isolation }}
      BUILDHOUND_BENCHMARK_SCENARIO: ${{ matrix.scenario }}
      # One anchor for the whole matrix: a per-job timestamp would split one nightly into N series.
      BUILDHOUND_BENCHMARK_SEED_REF: ${{ github.run_id }}
      ISOLATION: ${{ matrix.isolation }}
      SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Version + SHA-256 pinned, from Maven Central (gradle-profiler's distribution channel). The
      # checksum makes a swapped asset a loud failure instead of a silent binary substitution; a
      # bump is a deliberate change of both lines.
      - name: Install gradle-profiler
        env:
          PROFILER_VERSION: "0.24.0"
          PROFILER_SHA256: "74f39882a444d6d5616d35b3e9197f7423cd252f63f339bd3e01f662573b319c"
        run: |
          set -euo pipefail
          curl -fsSL -o gradle-profiler.zip \
            "https://repo1.maven.org/maven2/org/gradle/profiler/gradle-profiler/${PROFILER_VERSION}/gradle-profiler-${PROFILER_VERSION}.zip"
          echo "${PROFILER_SHA256}  gradle-profiler.zip" | sha256sum -c -
          unzip -q gradle-profiler.zip
          echo "$PWD/gradle-profiler-${PROFILER_VERSION}/bin" >> "$GITHUB_PATH"

      # gradle-profiler has no global gradle-args flag (those live in the scenario file), so the
      # isolation control is a gradle.properties override on the pilot (see isolation-modes.md).
      # full_cache = the pilot's committed configuration, untouched.
      - name: Apply cache isolation
        run: |
          set -euo pipefail
          if [ "$ISOLATION" = "no_build_cache" ]; then
            echo "org.gradle.caching=false" >> gradle.properties
          fi

      - name: Run benchmark
        # NOTE: run this against a checkout of the *pilot* project; add --project-dir if the pilot
        # is not the repository root, and point --scenario-file at your copy of the scenarios.
        run: |
          set -euo pipefail
          gradle-profiler --benchmark \
            --scenario-file buildhound-ci-assets/profiler-scenarios/buildhound.scenarios \
            --output-dir "profiler-out/$ISOLATION-$SCENARIO" \
            "$SCENARIO"

      # gradle-profiler's own measurements, kept independently of what reached the dashboard: when a
      # series looks wrong, this is how you tell "the build was slow" from "the upload was lost".
      - name: Upload profiler output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ matrix.isolation }}-${{ matrix.scenario }}
          path: profiler-out/**
          if-no-files-found: warn
          retention-days: 7
