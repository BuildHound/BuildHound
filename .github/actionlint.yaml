# Blacksmith runner labels are provisioned outside GitHub's hosted-label set, so
# actionlint needs them declared explicitly to avoid `runner-label` errors.
self-hosted-runner:
  labels:
    - blacksmith-2vcpu-ubuntu-2404
    - blacksmith-4vcpu-ubuntu-2404
    - blacksmith-8vcpu-ubuntu-2404
    - blacksmith-16vcpu-ubuntu-2404
    - blacksmith-32vcpu-ubuntu-2404
    - blacksmith-4vcpu-windows-2025
    - blacksmith-8vcpu-windows-2025
    - blacksmith-16vcpu-windows-2025
    - blacksmith-32vcpu-windows-2025
    - blacksmith-6vcpu-macos-15
    - blacksmith-12vcpu-macos-15
    - blacksmith-6vcpu-macos-26
    - blacksmith-12vcpu-macos-26

# actionlint 1.7.12 predates GitHub's `concurrency.queue` schema (added in 2026).
# Keep every other workflow check enabled; remove this narrow exception after the
# linter release learns the official `queue: max` key.
paths:
  # deploy.yml is plan 090's collapse of deploy-release.yml + publish-deploy-images.yml;
  # the queue-key exception moves with it.
  .github/workflows/deploy.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/publish-gradle-plugin.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/reconcile-reviews.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/review-environment.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
