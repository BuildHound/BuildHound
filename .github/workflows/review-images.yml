name: Build review images
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions: {contents: read}
jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy: {fail-fast: false, matrix: {image: [server, site]}}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "${{ github.event.pull_request.head.sha }}"
          persist-credentials: false
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: buildhound/buildhound-server
      - name: Build without registry or deployment credentials
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ${{ matrix.image == 'server' && 'buildhound-server/Dockerfile' || 'site/Dockerfile' }}
          push: false
