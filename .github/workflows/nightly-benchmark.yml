name: nightly-benchmark

# Scheduled gradle-profiler benchmark series for BuildHound's own sample pilots (plan 105; spec §7,
# plan 030 benchmark mode). Each measured build is uploaded by the plugin as mode=benchmark tagged
# with (scenario, isolationMode, seedRef); the server keeps those out of fleet trends and surfaces
# them at #/benchmark on the production dashboard.
#
# Shape notes (they are load-bearing, see plan 105 §3.2):
#  - ONE scenario per job. The plugin reads BUILDHOUND_BENCHMARK_* inside the measured daemon, and
#    gradle-profiler reuses daemons; a job per scenario means a fresh runner and a fresh daemon, so
#    a scenario can never inherit the previous scenario's label.
#  - The seed ref is github.run_id, so every job of one nightly shares a single series anchor. A
#    per-job timestamp would split the matrix across N series.
#  - The samples apply the plugin from source (settings.gradle.kts includeBuild("../..")), so no
#    publishToMavenLocal bootstrap is needed here — unlike the root-build dogfood path in ci.yml.
#  - The samples keep their committed local-development config (server.url = http://localhost:8080).
#    The ingest target is injected by .github/buildhound-sample-benchmark.init.gradle.kts, installed
#    into the init.d of the Gradle user home the PROFILER uses — see the install step below; that
#    home is named explicitly here, and it is NOT ~/.gradle (plan 109).
#  - No setup-gradle cache restore: each job starts with a cold Gradle user home and the scenario's
#    warm-up build warms it. Cross-run cache restore would add variance the series can't attribute.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC nightly
  workflow_dispatch: {} # allow manual runs (also how this is verified after merge)

permissions:
  contents: read

# Never let two nightlies (or a nightly and a manual run) interleave into one seed ref's series;
# queue rather than cancel so a manual verification run isn't killed by the schedule.
concurrency:
  group: nightly-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    name: "${{ matrix.pilot }} · ${{ matrix.scenario }} · ${{ matrix.isolation }}"
    # Forks inherit scheduled workflows; without this a fork would run a 20-job Android matrix
    # nightly (and, with no secrets, upload nothing anyway).
    if: github.repository == 'BuildHound/BuildHound'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Watched, non-blocking (roadmap guardrail, same posture as overhead-budget): a runner OOM or a
    # flaky Android SDK download must not turn the nightly red and train us to ignore it.
    continue-on-error: true
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Caps concurrent runners; the full matrix is 20 jobs of real Gradle/Android builds.
      max-parallel: 4
      matrix:
        pilot: [springboot-legacy, android-legacy-agp, nowinandroid]
        isolation: [full_cache, no_build_cache]
        scenario: [clean, no_op, incremental_non_abi, cc_hit]
        exclude:
          # springboot-legacy ships org.gradle.caching=false on purpose (it is the deliberately
          # sub-optimal pilot). Labelling that run `full_cache` would be a false label, and forcing
          # caching on would erase what the sample exists to show — so it only runs no_build_cache.
          - pilot: springboot-legacy
            isolation: full_cache
    # Job-level env on purpose: the runner echoes STEP-level env mappings verbatim, which leaks
    # `vars.*` values (secrets stay masked). Job-level env is not echoed per step.
    env:
      # Sample-scoped names, read by the init script only. NOT BUILDHOUND_SERVER_URL /
      # BUILDHOUND_TOKEN: those are the plugin's plan-027 convention fallbacks and would arm uploads
      # in any other instrumented build on this runner. The URL expression collapses to '' when the
      # prod ingest secret is absent, and UploadGate skips on an empty URL ("no server configured")
      # — so this workflow is safe to merge before/without credentials and can never POST
      # unauthenticated.
      BUILDHOUND_SAMPLE_SERVER_URL: ${{ secrets.BUILDHOUND_PROD_INGEST_TOKEN != '' && vars.BUILDHOUND_PROD_SERVER_URL || '' }}
      # Ingest-scoped (plan 094 slot). Leaves only via the plugin's Authorization header; never
      # echoed, never on argv.
      BUILDHOUND_SAMPLE_TOKEN: ${{ secrets.BUILDHOUND_PROD_INGEST_TOKEN }}
      BUILDHOUND_BENCHMARK_SCENARIO: ${{ matrix.scenario }}
      BUILDHOUND_BENCHMARK_ISOLATION: ${{ matrix.isolation }}
      BUILDHOUND_BENCHMARK_SEED_REF: ${{ github.run_id }}
      PILOT: ${{ matrix.pilot }}
      ISOLATION: ${{ matrix.isolation }}
      SCENARIO: ${{ matrix.scenario }}
      # The Gradle user home every measured build runs against, named by us rather than left to
      # gradle-profiler's default (plan 109 §4.1). Two things depend on it being explicit: the init
      # script below is installed into ITS init.d, and `--gradle-user-home` on the profiler makes
      # the two halves impossible to drift apart. Deliberately OUTSIDE profiler-out/, which is
      # uploaded wholesale as an artifact.
      BENCHMARK_GRADLE_USER_HOME: ${{ github.workspace }}/benchmark-gradle-home
    steps:
      - uses: actions/checkout@v7

      # 26 for the included BuildHound build's toolchain, 21 LAST so it stays JAVA_HOME: Gradle
      # 8.14.5 (android-legacy-agp) cannot RUN on 26 (plan 011). Same pattern as ci.yml's
      # build-floor / overhead-budget jobs. The Android pilots use the runner image's preinstalled
      # SDK via ANDROID_HOME / ANDROID_SDK_ROOT.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            26
            21

      # First Android build in this repo's CI (infra review): nothing here has ever depended on the
      # runner image's SDK, so the platform each pilot compiles against is installed explicitly
      # rather than assumed — nowinandroid is compileSdk 36, android-legacy-agp is 34. The action
      # also accepts the SDK licenses, which is what lets AGP auto-download the matching
      # build-tools. Skipped for the JVM-only pilot.
      - name: Set up Android SDK
        if: matrix.pilot != 'springboot-legacy'
        uses: android-actions/setup-android@v4
        with:
          packages: ${{ matrix.pilot == 'nowinandroid' && 'platforms;android-36' || 'platforms;android-34' }}

      # Version + SHA-256 pinned, from Maven Central (gradle-profiler's distribution channel) —
      # identical posture to ci.yml's overhead-budget job. The checksum turns a swapped asset into
      # a loud failure instead of a silent binary substitution.
      - name: Install gradle-profiler
        env:
          PROFILER_VERSION: "0.24.0"
          PROFILER_SHA256: "74f39882a444d6d5616d35b3e9197f7423cd252f63f339bd3e01f662573b319c"
        run: |
          set -euo pipefail
          # --retry: Maven Central answered 429 to one cell of the 2026-08-14 nightly, which died
          # here at 18s with `curl: (22) ... error: 429` before running a single build. curl treats
          # 429 as a transient error, so this is the whole fix; the SHA-256 below still gates what
          # a retry is allowed to hand us.
          curl -fsSL --retry 5 --retry-delay 3 -o gradle-profiler.zip \
            "https://repo1.maven.org/maven2/org/gradle/profiler/gradle-profiler/${PROFILER_VERSION}/gradle-profiler-${PROFILER_VERSION}.zip"
          echo "${PROFILER_SHA256}  gradle-profiler.zip" | sha256sum -c -
          unzip -q gradle-profiler.zip
          echo "$PWD/gradle-profiler-${PROFILER_VERSION}/bin" >> "$GITHUB_PATH"

      # Init-script injection (plan 105), the same CI-injection pattern as the dogfood path: an
      # init.d script applies to every Gradle invocation gradle-profiler makes without touching the
      # pilot or the scenario files, so no --project-dir-relative -I path has to be threaded through
      # gradle-args. It redirects the sample's committed localhost demo server to the env-provided
      # ingest target; on a build with no `buildhound` extension (the included plugin build) it is a
      # no-op. Empty/absent BUILDHOUND_SAMPLE_SERVER_URL => the upload is skipped, not retargeted.
      #
      # It goes into BENCHMARK_GRADLE_USER_HOME/init.d, NOT ~/.gradle/init.d. Gradle reads init.d
      # only from the Gradle user home actually in use, and gradle-profiler does not use ~/.gradle —
      # it runs every measured build against a dedicated home. Installing into ~/.gradle meant the
      # script was never on any measured build's init-script path: four nightlies benchmarked
      # correctly, kept the sample's localhost target, and published nothing (plan 109 §2).
      - name: Install BuildHound sample init script
        run: |
          set -euo pipefail
          mkdir -p "$BENCHMARK_GRADLE_USER_HOME/init.d"
          cp .github/buildhound-sample-benchmark.init.gradle.kts "$BENCHMARK_GRADLE_USER_HOME/init.d/"
          echo "init script installed into $BENCHMARK_GRADLE_USER_HOME/init.d"

      # Make the credential-absent path OBSERVABLE. Everything else about a non-publishing run is
      # silent by design: UploadGate's "no server configured" skip logs at info (invisible at
      # Gradle's default level), the plugin never fails a build, and this job is continue-on-error.
      # Without this step a rotated-away or renamed credential produces 20 green jobs a night that
      # publish nothing, indefinitely. Neither value is echoed — the URL is a repo *variable*, which
      # the runner does not mask.
      - name: Report ingest wiring
        run: |
          set -euo pipefail
          if [ -z "${BUILDHOUND_SAMPLE_SERVER_URL:-}" ] || [ -z "${BUILDHOUND_SAMPLE_TOKEN:-}" ]; then
            echo "::warning title=BuildHound benchmark::no ingest target configured — this job measures but publishes nothing (check vars.BUILDHOUND_PROD_SERVER_URL / secrets.BUILDHOUND_PROD_INGEST_TOKEN)"
            echo "⚠️ no ingest target configured — measured, published nothing" >> "$GITHUB_STEP_SUMMARY"
          else
            # "configured", not "published": this step runs before any build. Whether telemetry
            # actually reached the server is asserted after the benchmark, by `Verify telemetry
            # published` — the distinction plan 109 §2.1 exists because of.
            echo "✅ ingest target configured — publication asserted after the benchmark" >> "$GITHUB_STEP_SUMMARY"
          fi

      # The isolation mechanism from profiler-pipeline/isolation-modes.md. The checkout is fresh per
      # job, so this is a plain append — no pristine-copy dance. full_cache = the pilot's committed
      # configuration, untouched.
      - name: Apply cache isolation
        run: |
          set -euo pipefail
          if [ "$ISOLATION" = "no_build_cache" ]; then
            echo "org.gradle.caching=false" >> "samples/$PILOT/gradle.properties"
            echo "isolation=$ISOLATION: appended org.gradle.caching=false to samples/$PILOT/gradle.properties"
          else
            echo "isolation=$ISOLATION: pilot configuration left untouched"
          fi

      # One scenario per invocation (the plugin reads the scenario env once per daemon). Scenario
      # files are per-pilot because tasks and the non-ABI source path differ; the scenario NAMES are
      # the plugin's allowlist (BenchmarkActivation.SCENARIOS).
      - name: Run benchmark
        run: |
          set -euo pipefail
          gradle-profiler --benchmark \
            --gradle-user-home "$BENCHMARK_GRADLE_USER_HOME" \
            --project-dir "samples/$PILOT" \
            --scenario-file "buildhound-ci-assets/profiler-scenarios/samples/$PILOT.scenarios" \
            --output-dir "profiler-out/$PILOT-$ISOLATION-$SCENARIO" \
            "$SCENARIO"

      # The check plan 105 §5 needed and did not have (plan 109 §4.2). "Silent non-publication" was
      # mitigated by `Report ingest wiring` above, which asserts the credentials are SET — they were
      # set, correctly, on four consecutive nights that published nothing. This assertion is keyed on
      # the POST instead, read out of gradle-profiler's own build log.
      #
      # Positive, not merely the absence of a failure: a build that skipped the upload entirely
      # (UploadGate's "no server configured", logged at info and thus invisible) prints NEITHER the
      # success nor the failure line, and must be caught. Every layer below this is quiet by design —
      # the gate's info-level skip, the plugin's never-fail-a-build posture, the job's
      # continue-on-error — so a green cell is not evidence of anything without it.
      #
      # ≥1 upload, not an exact count: a passing cell publishes warm-ups + iterations payloads, and
      # those counts live in the per-pilot scenario file. Pinning the arithmetic here would make an
      # unrelated scenario edit fail the nightly for the wrong reason.
      #
      # The redirect marker is a DIAGNOSTIC inside the failure branch, never a per-build assertion,
      # and must stay one. `settingsEvaluated` does not run on a configuration-cache hit, so the
      # marker appears only on CC-miss builds — in a cc_hit cell, the cold-home first build and no
      # other (the CC entry replays the redirected target, which is why the uploads still happen).
      # Requiring one marker per upload would redden every cc_hit cell.
      #
      # Runs only on a successful benchmark (default success() condition), so a profiler crash still
      # surfaces as itself rather than as a publication failure.
      - name: Verify telemetry published
        run: |
          set -euo pipefail
          log="profiler-out/$PILOT-$ISOLATION-$SCENARIO/profile.log"
          if [ ! -f "$log" ]; then
            echo "::error title=BuildHound benchmark::$log missing — cannot verify publication for $PILOT · $SCENARIO · $ISOLATION"
            echo "❌ $PILOT · $SCENARIO · $ISOLATION — no profiler log, publication unverifiable" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # grep -c exits 1 on zero matches; `|| true` keeps that out of `set -e`'s way.
          # All four of PayloadUploader's terminal states are counted. `rejected` is the one that
          # cost this check its first review finding: a 4xx DELETES the payload rather than spooling
          # it, so a cell that uploads three and has one rejected would otherwise print a green
          # "3 payload(s) published" over a permanent loss.
          uploaded=$(grep -c "\[buildhound\] payload uploaded" "$log" || true)
          failed=$(grep -c "\[buildhound\] upload failed" "$log" || true)
          rejected=$(grep -c "\[buildhound\] server rejected" "$log" || true)
          drained=$(grep -c "\[buildhound\] drained" "$log" || true)
          # Each condition states what it actually observed. The old single message asserted
          # "published nothing" for every failure mode, which is a lie about a cell that published
          # four payloads and spooled a fifth.
          why=""
          if [ "$uploaded" -eq 0 ]; then
            why="published nothing"
          fi
          if [ "$rejected" -ne 0 ]; then
            why="${why:+$why; }$rejected payload(s) rejected by the server and permanently dropped"
          fi
          if [ "$failed" -ne 0 ]; then
            why="${why:+$why; }$failed upload(s) spooled after a failed POST, $drained drain(s) logged — the final build's spool is never retried"
          fi
          if [ -n "$why" ]; then
            echo "::error title=BuildHound benchmark::$PILOT · $SCENARIO · $ISOLATION — $why (uploaded=$uploaded, failed=$failed, rejected=$rejected)"
            echo "❌ $PILOT · $SCENARIO · $ISOLATION — $why" >> "$GITHUB_STEP_SUMMARY"
            # Name the cause, since the three that produce a silent cell need different repairs.
            if ! grep -q "sample benchmark init: telemetry redirected" "$log"; then
              if [ "$uploaded" -eq 0 ] && [ "$failed" -eq 0 ] && [ "$rejected" -eq 0 ]; then
                # No POST was attempted at all: either the init script never reached these builds
                # (plan 109's defect) or it applied and took its credentials-absent branch, which
                # disables the upload by design. `Report ingest wiring` above distinguishes them.
                echo "::error title=BuildHound benchmark::no upload was attempted — the init script either never applied, or applied with BUILDHOUND_SAMPLE_* absent (see the Report ingest wiring step)"
              else
                echo "::error title=BuildHound benchmark::the init script never applied — the ingest target was never redirected off the sample's committed localhost URL"
              fi
            fi
            exit 1
          fi
          echo "✅ $PILOT · $SCENARIO · $ISOLATION — $uploaded payload(s) published" >> "$GITHUB_STEP_SUMMARY"

      # continue-on-error makes a failed cell conclude "success" at the run level, which also
      # suppresses GitHub's scheduled-failure mail (infra review). That posture is deliberate — a
      # noisy nightly gets ignored — but a failure must not be invisible: this leaves a run-page
      # annotation and a summary line naming the cell that died. Step-level `failure()` still
      # evaluates inside a continue-on-error job.
      - name: Flag failed cell
        if: failure()
        run: |
          set -euo pipefail
          echo "::warning title=BuildHound benchmark::$PILOT / $SCENARIO / $ISOLATION failed — this run publishes no series for that cell"
          echo "❌ $PILOT · $SCENARIO · $ISOLATION failed" >> "$GITHUB_STEP_SUMMARY"

      # gradle-profiler's own measurements, kept independently of what reached the dashboard: when a
      # series looks wrong, this is how we tell "the build was slow" from "the upload was lost".
      - name: Upload profiler output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ matrix.pilot }}-${{ matrix.isolation }}-${{ matrix.scenario }}
          path: profiler-out/**
          if-no-files-found: warn
          retention-days: 7
